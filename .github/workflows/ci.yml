name: Build Docker Image and Deploy to DockerHub

on: 
  push:
    branches:
      - main 


jobs: 
  build_and_deploy_docker_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: build and deploy image
        env: 
          docker_login_password: ${{ secrets.DOCKER_LOGIN_PASSWORD }} 
        run: |
          docker build -t otisahmed10/expense_tracker:latest ./app
          echo "$docker_login_password" | docker login -u otisahmed10 --password-stdin
          docker push otisahmed10/expense_tracker:latest
